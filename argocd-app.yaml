apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qrc-onpremises-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/NagaPurnaSai/php-website.git'
    targetRevision: HEAD
    path: '.' 
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
